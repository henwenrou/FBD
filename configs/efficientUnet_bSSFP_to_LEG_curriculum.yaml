model:
  target: segmentation_models_pytorch.Unet
  params:
    encoder_name: efficientnet-b2
    encoder_weights: null
    in_channels: 1
    classes: 4
    activation: null

optimizer:
  target: torch.optim.Adam
  learning_rate: 3e-4
  weight_decay: 3e-5
  max_epoch: 200
  max_iter: -1
  warmup_iter: -1
  lr_scheduler: lambda

saliency_balancing_fusion:
  usage: false
  grid_size: 18

core_fbd:
  usage: true
  num_views: 3
  saliency_threshold: 0.65
  pred_var_threshold: 0.02
  saliency_grid: 16
  use_pred_consistency: true
  slaug:
    brightness: 0.08
    contrast: 0.08
    noise_std: 0.01
    max_rotate: 5
    max_translate: 0.02
    max_scale: 0.05
    flip: true
  curriculum:
    enabled: true
    total_epochs: 200
    warmup_ratio: 0.2
    ramp_ratio: 0.4
    start_lambda: 0.0
    max_lambda: 1.0
    final_lambda: 0.9
    schedule: cosine
  frequency:
    p_fourier: 0.7
    sigma: 0.08
    alpha_range: [0.7, 1.0]
    eps_max: 0.3
    num_bands: 4
    band_weights: [2.0, 1.0, 0.4, 1.6]
    active_bands: [0, 3]
    lambda_core: [0.0, 0.0, 0.0, 0.05]
    lambda_noncore: [1.6, 1.2, 0.6, 1.6]
    background_only: true
    saliency_exponent: 1.5
  loss:
    lambda_core_inv: 1.0
    lambda_noncore_reg: 0
    noncore_margin: 0.7

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 32
    num_workers: 8
    train:
      target: dataloaders.CardiacDataset.get_training
      params:
        location_scale: false
        fourier_aug:
          mode: baseline
          p_fourier: 0.5
          sigma: 0.08
          alpha_range: [0.7, 1.0]
          eps_max: 0.3
          num_bands: 4
          band_weights: [2.0, 1.5, 1.0, 0.5]
        modality:
          - bSSFP
        tile_z_dim: 1
    validation:
      target: dataloaders.CardiacDataset.get_validation
      params:
        modality:
          - bSSFP
        tile_z_dim: 1
    test:
      target: dataloaders.CardiacDataset.get_test
      params:
        modality:
          - LGE
        tile_z_dim: 1
