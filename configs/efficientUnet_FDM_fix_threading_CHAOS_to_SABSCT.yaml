model:
  target: util.unet_fdm_wrapper.UNetWithFDM
  params:
    encoder_name: efficientnet-b2
    encoder_weights: null
    in_channels: 1
    classes: 5
    activation: null
    # Frequency Domain Modulation parameters - OPTIMIZED
    fdm_enabled: true
    fdm_stages: [2, 3]
    fdm_num_bands: 4    # Reduced to 4 for speed
    fdm_alpha: 0.5
    fdm_delta: 0.2
    fdm_eps: 1.0e-6
    fdm_init_from_stats: false  # DISABLED to avoid IFFT/FFT overhead
    fdm_update_stats_interval: 999999

optimizer:
  target: torch.optim.Adam
  learning_rate: 3e-4
  weight_decay: 3e-5
  max_epoch: 2000
  max_iter: -1
  warmup_iter: -1
  lr_scheduler: lambda

saliency_balancing_fusion:
  usage: true
  grid_size: 3

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 32
    num_workers: 0  # CRITICAL: Set to 0 to avoid threading conflicts with OMP_NUM_THREADS=1
    train:
      target: dataloaders.AbdominalDataset.get_training
      params:
        location_scale: true
        modality:
          - CHAOST2
        tile_z_dim: 1
    validation:
      target: dataloaders.AbdominalDataset.get_validation
      params:
        modality:
          - CHAOST2
        tile_z_dim: 1
    test:
      target: dataloaders.AbdominalDataset.get_test_all
      params:
        modality:
          - SABSCT
        tile_z_dim: 1
